<style>
#dango-face-design { color-scheme: light dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.5; --fd-bg: light-dark(#FDFCF9,#282622); --fd-ink: light-dark(#443D34,#EFEAE2); --fd-muted: light-dark(#807568,#C0B6A8); --fd-line: light-dark(#E9E4DA,#514A41); --fd-soft: light-dark(#F3EFE8,#37322C); --fd-selected: light-dark(#EFE3D4,#534330); --fd-accent: light-dark(#885E3E,#E2BD96); color: var(--fd-ink); }
#dango-face-design * { box-sizing: border-box; }
#dango-face-design .fd-window { background: var(--fd-bg); border: 1px solid var(--fd-line); border-radius: 12px; overflow: hidden; }
#dango-face-design .fd-chrome { display: flex; align-items: center; gap: 18px; padding: 15px 24px; padding-right: 110px; border-bottom: 1px solid var(--fd-line); }
#dango-face-design .fd-brand { font-size: 18px; font-weight: 500; }
#dango-face-design .fd-muted { color: var(--fd-muted); font-size: 12px; }
#dango-face-design .fd-content { display: grid; grid-template-columns: minmax(0,1fr) var(--fd-editor-width,280px); gap: 32px; padding: 28px 36px; }
#dango-face-design .fd-stage { min-width: 0; display: flex; flex-direction: column; align-items: center; }
#dango-face-design .fd-stage-heading { align-self: flex-start; font-size: 16px; }
#dango-face-design .fd-scene { min-height: 290px; width: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 28px 8px; }
#dango-face-design .fd-dango { position: relative; width: var(--fd-body-width,240px); max-width: 100%; height: calc(var(--fd-body-width,240px) * .67); flex-shrink: 1; background: var(--fd-body,#FFE8C2); border-radius: 48% 48% 40% 40% / 64% 64% 33% 33%; }
#dango-face-design .fd-face { position: absolute; top: 51%; left: 50%; display: flex; gap: calc(var(--fd-body-width,240px) * .17); transform: translate(-50%,-50%); }
#dango-face-design .fd-eye { width: calc(var(--fd-body-width,240px) * .075 * var(--fd-eye-size,1) * var(--fd-eye-width,1)); height: calc(var(--fd-body-width,240px) * .075 * var(--fd-eye-size,1) * var(--fd-eye-height,1)); background: var(--fd-eye,#2B201E); border-radius: 50%; }
#dango-face-design .fd-dango[data-expression="closed"] .fd-eye { background: transparent; border-bottom: 3px solid var(--fd-eye,#2B201E); border-radius: 0 0 50% 50%; height: 7px; }
#dango-face-design .fd-ground { width: 82%; height: 1px; background: var(--fd-line); }
#dango-face-design .fd-compare { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
#dango-face-design button { font: inherit; font-weight: 400; color: var(--fd-ink); background: transparent; border: 1px solid var(--fd-line); border-radius: 7px; padding: 8px 12px; min-height: 38px; }
#dango-face-design button:hover { background: var(--fd-soft); }
#dango-face-design button[aria-pressed="true"] { background: var(--fd-selected); border-color: var(--fd-accent); }
#dango-face-design button:disabled { opacity: .55; }
#dango-face-design .fd-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--fd-line); margin-bottom: 20px; }
#dango-face-design .fd-tab { border: 0; border-radius: 0; border-bottom: 2px solid transparent; padding: 8px 4px; }
#dango-face-design .fd-tab[aria-selected="true"] { border-bottom-color: var(--fd-accent); color: var(--fd-accent); }
#dango-face-design .fd-field { margin-bottom: 24px; }
#dango-face-design .fd-field-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
#dango-face-design .fd-hex { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--fd-muted); }
#dango-face-design .fd-color-line { display: flex; align-items: center; gap: 12px; }
#dango-face-design input[type="color"] { width: 50px; height: 40px; padding: 3px; border: 1px solid var(--fd-line); background: var(--fd-bg); border-radius: 7px; }
#dango-face-design .fd-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
#dango-face-design .fd-swatch { min-width: 38px; padding: 5px; }
#dango-face-design .fd-dot { width: 24px; height: 24px; border-radius: 50%; display: block; background: var(--swatch); }
#dango-face-design .fd-preset-row { display: flex; gap: 7px; flex-wrap: wrap; }
#dango-face-design .fd-preset { flex: 1; min-width: 70px; padding: 10px 5px; }
#dango-face-design .fd-mini-face { display: flex; justify-content: center; gap: 9px; height: 20px; align-items: center; margin-bottom: 6px; }
#dango-face-design .fd-mini-eye { width: 8px; height: 8px; border-radius: 50%; background: var(--fd-ink); }
#dango-face-design [data-eye-shape="tall"] .fd-mini-eye { width: 6px; height: 9px; }
#dango-face-design [data-eye-shape="wide"] .fd-mini-eye { width: 9px; height: 6px; }
#dango-face-design .fd-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 18px 24px; border-top: 1px solid var(--fd-line); align-items: center; }
#dango-face-design .fd-status { margin-right: auto; font-size: 12px; color: var(--fd-muted); }
#dango-face-design .fd-primary { background: var(--fd-accent); border-color: var(--fd-accent); color: var(--fd-bg); min-width: 78px; }
#dango-face-design .fd-primary:hover { background: var(--fd-accent); }
#dango-face-design [hidden] { display: none; }
@media (max-width: 620px) { #dango-face-design .fd-content { grid-template-columns: 1fr; gap: 28px; padding: 20px; } #dango-face-design .fd-scene { min-height: 215px; padding-bottom: 20px; } #dango-face-design .fd-chrome { flex-wrap: wrap; padding-left: 20px; } #dango-face-design .fd-actions { padding: 16px 20px; } #dango-face-design .fd-status { width: 100%; } }
@media (pointer: coarse) { #dango-face-design button { min-height: 44px; } #dango-face-design input[type="color"] { height: 44px; } }
</style>
<div id="dango-face-design">
  <section class="fd-window" aria-label="团子自身捏脸设计预览">
    <header class="fd-chrome"><span class="fd-brand">Dango</span><span class="fd-muted">捏脸 · 设计预览</span></header>
    <div class="fd-content">
      <section class="fd-stage" aria-label="团子长相预览">
        <div class="fd-stage-heading">我的团子</div>
        <div class="fd-scene"><div class="fd-dango" role="img" aria-label="奶油色圆眼团子"><div class="fd-face"><span class="fd-eye"></span><span class="fd-eye"></span></div></div></div>
        <div class="fd-ground"></div>
        <div class="fd-compare"><button type="button" class="cursor-interaction" data-action="blink">眨眼</button><button type="button" class="cursor-interaction" data-action="sleep">睡眠 / 醒来</button></div>
      </section>
      <section class="fd-editor" aria-label="团子自身编辑">
        <div class="fd-tabs" role="tablist" aria-label="捏脸部位"><button type="button" class="fd-tab cursor-interaction" role="tab" id="fd-color-tab" aria-controls="fd-color-panel" aria-selected="true" data-tab="color">颜色</button><button type="button" class="fd-tab cursor-interaction" role="tab" id="fd-eyes-tab" aria-controls="fd-eyes-panel" aria-selected="false" data-tab="eyes">眼睛</button></div>
        <div id="fd-color-panel" role="tabpanel" aria-labelledby="fd-color-tab">
          <div class="fd-field"><div class="fd-field-head"><label for="fd-body-color">身体颜色</label><output class="fd-hex" data-value="body"></output></div><div class="fd-color-line"><input id="fd-body-color" class="cursor-interaction" type="color" value="#ffe8c2"><span class="fd-muted">打开调色盘</span></div><div class="fd-quick"><button type="button" class="fd-swatch cursor-interaction" aria-label="身体奶油色 #FFE8C2" data-body-color="#FFE8C2"><span class="fd-dot" style="--swatch:#FFE8C2"></span></button><button type="button" class="fd-swatch cursor-interaction" aria-label="身体浅蓝色 #C9E2FF" data-body-color="#C9E2FF"><span class="fd-dot" style="--swatch:#C9E2FF"></span></button><button type="button" class="fd-swatch cursor-interaction" aria-label="身体浅紫色 #DDCCF8" data-body-color="#DDCCF8"><span class="fd-dot" style="--swatch:#DDCCF8"></span></button></div></div>
          <div class="fd-field"><div class="fd-field-head"><label for="fd-eye-color">眼睛颜色</label><output class="fd-hex" data-value="eye"></output></div><div class="fd-color-line"><input id="fd-eye-color" class="cursor-interaction" type="color" value="#2b201e"><span class="fd-muted">打开调色盘</span></div></div>
        </div>
        <div id="fd-eyes-panel" role="tabpanel" aria-labelledby="fd-eyes-tab" hidden>
          <div class="fd-field"><div class="fd-field-head">基础眼型</div><div class="fd-preset-row"><button type="button" class="fd-preset cursor-interaction" data-eye-shape="round" aria-pressed="true"><span class="fd-mini-face" aria-hidden="true"><span class="fd-mini-eye"></span><span class="fd-mini-eye"></span></span>圆眼</button><button type="button" class="fd-preset cursor-interaction" data-eye-shape="tall" aria-pressed="false"><span class="fd-mini-face" aria-hidden="true"><span class="fd-mini-eye"></span><span class="fd-mini-eye"></span></span>纵椭圆</button><button type="button" class="fd-preset cursor-interaction" data-eye-shape="wide" aria-pressed="false"><span class="fd-mini-face" aria-hidden="true"><span class="fd-mini-eye"></span><span class="fd-mini-eye"></span></span>横椭圆</button></div></div>
          <div class="fd-field"><div class="fd-field-head">眼睛大小</div><div class="fd-preset-row"><button type="button" class="cursor-interaction" data-eye-size="small" aria-pressed="false">小</button><button type="button" class="cursor-interaction" data-eye-size="standard" aria-pressed="true">标准</button><button type="button" class="cursor-interaction" data-eye-size="large" aria-pressed="false">大</button></div></div>
        </div>
      </section>
    </div>
    <footer class="fd-actions"><output class="fd-status" aria-live="polite">草稿与默认一致</output><button type="button" class="cursor-interaction" data-action="default">恢复默认</button><button type="button" class="cursor-interaction" data-action="cancel" disabled>取消</button><button type="button" class="fd-primary cursor-interaction" data-action="apply" disabled>应用</button></footer>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('dango-face-design');
  const defaults = {body:'#FFE8C2',eye:'#2B201E',shape:'round',size:'standard'};
  const shapes = {round:'圆眼',tall:'纵椭圆',wide:'横椭圆'};
  const sizes = {small:.85,standard:1,large:1.15};
  const copy = value => ({...value});
  function config(value) { return value && /^#[0-9A-F]{6}$/.test(value.body) && /^#[0-9A-F]{6}$/.test(value.eye) && Object.hasOwn(shapes,value.shape) && Object.hasOwn(sizes,value.size) ? {body:value.body,eye:value.eye,shape:value.shape,size:value.size} : copy(defaults); }
  const remembered = window.openai?.widgetState;
  const initial = remembered?.modelContent?.kind === 'dango-face-design-v1' ? remembered.privateContent : null;
  let applied = config(initial?.applied), draft = config(initial?.draft), tab = initial?.tab === 'eyes' ? 'eyes' : 'color';
  let expression = 'open', timeout = null, message = '';
  const design = {editorWidth:280,bodyWidth:240,saveResult:'success'};
  const dango = root.querySelector('.fd-dango');
  const status = root.querySelector('.fd-status');
  const equal = (a,b) => Object.keys(defaults).every(key=>a[key] === b[key]);
  function stopExpression() { clearTimeout(timeout); expression = 'open'; }
  function render() {
    root.style.setProperty('--fd-editor-width',design.editorWidth+'px'); root.style.setProperty('--fd-body-width',design.bodyWidth+'px');
    root.style.setProperty('--fd-body',draft.body); root.style.setProperty('--fd-eye',draft.eye); root.style.setProperty('--fd-eye-size',sizes[draft.size]);
    root.style.setProperty('--fd-eye-width',draft.shape==='tall' ? 0.8 : 1); root.style.setProperty('--fd-eye-height',draft.shape==='wide' ? 0.8 : 1);
    dango.dataset.expression = expression === 'open' ? 'open' : 'closed';
    root.querySelector('[data-action="sleep"]').textContent=expression==='sleep'?'醒来':'睡眠';
    dango.setAttribute('aria-label',`身体 ${draft.body}，眼睛 ${draft.eye}，${shapes[draft.shape]}，${{small:'小',standard:'标准',large:'大'}[draft.size]}眼睛，${expression==='open'?'睁眼':'闭眼'}`);
    root.querySelector('#fd-body-color').value=draft.body; root.querySelector('#fd-eye-color').value=draft.eye;
    root.querySelector('[data-value="body"]').textContent=draft.body; root.querySelector('[data-value="eye"]').textContent=draft.eye;
    root.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===tab)));
    root.querySelector('#fd-color-panel').hidden=tab!=='color'; root.querySelector('#fd-eyes-panel').hidden=tab!=='eyes';
    root.querySelectorAll('[data-eye-shape]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.eyeShape===draft.shape)));
    root.querySelectorAll('[data-eye-size]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.eyeSize===draft.size)));
    root.querySelectorAll('[data-body-color]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.bodyColor===draft.body)));
    const dirty=!equal(draft,applied); root.querySelector('[data-action="apply"]').disabled=!dirty; root.querySelector('[data-action="cancel"]').disabled=!dirty;
    status.textContent=message || (dirty?'草稿 · 未应用':'与本页已应用外观一致');
  }
  function remember() {
    const host=window.openai;
    if(host?.setWidgetState) host.setWidgetState({modelContent:{kind:'dango-face-design-v1',body:draft.body,eye:draft.eye,eyeShape:shapes[draft.shape],eyeSize:({small:'小',standard:'标准',large:'大'})[draft.size],unapplied:!equal(draft,applied)},privateContent:{draft:copy(draft),applied:copy(applied),tab}}).catch(()=>{});
  }
  function change(mutator) { message=''; mutator(); render(); remember(); }
  root.addEventListener('input',event=>{if(event.target.id==='fd-body-color')change(()=>draft.body=event.target.value.toUpperCase()); if(event.target.id==='fd-eye-color')change(()=>draft.eye=event.target.value.toUpperCase());});
  root.addEventListener('click',event=>{
    const button=event.target.closest('button'); if(!button || !root.contains(button))return;
    if(button.dataset.tab)change(()=>tab=button.dataset.tab);
    if(button.dataset.bodyColor)change(()=>draft.body=button.dataset.bodyColor);
    if(button.dataset.eyeShape)change(()=>draft.shape=button.dataset.eyeShape);
    if(button.dataset.eyeSize)change(()=>draft.size=button.dataset.eyeSize);
    if(button.dataset.action==='default')change(()=>{stopExpression();draft=copy(defaults);});
    if(button.dataset.action==='cancel')change(()=>{stopExpression();draft=copy(applied);message='已取消草稿';});
    if(button.dataset.action==='apply')change(()=>{if(design.saveResult==='failure'){message='本次未应用，可重试或取消';return;}applied=copy(draft);message='本页已应用';});
    if(button.dataset.action==='blink'){stopExpression();expression='blink';render();timeout=setTimeout(()=>{expression='open';render();},window.matchMedia('(prefers-reduced-motion: reduce)').matches?450:180);}
    if(button.dataset.action==='sleep'){const wasSleeping=expression==='sleep';stopExpression();if(!wasSleeping)expression='sleep';render();if(!wasSleeping)timeout=setTimeout(()=>{expression='open';render();},1500);}
  });
  root.addEventListener('keydown',event=>{ const button=event.target.closest('[role="tab"]'); if(button && ['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();change(()=>tab=tab==='color'?'eyes':'color');root.querySelector(`[data-tab="${tab}"]`).focus();}});
  window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot?.modelContent?.kind!=='dango-face-design-v1')return;const saved=snapshot.privateContent;applied=config(saved?.applied);draft=config(saved?.draft);tab=saved?.tab==='eyes'?'eyes':'color';message='';stopExpression();render();});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'editorWidth',{label:'编辑区宽度',min:240,max:310,step:10,unit:'px'});tweak.addSlider(design,'bodyWidth',{label:'预览占比',min:210,max:270,step:10,unit:'px'});tweak.addSelect(design,'saveResult',{label:'应用结果',options:[{label:'成功',value:'success'},{label:'失败',value:'failure'}]});}
})();
</script>
