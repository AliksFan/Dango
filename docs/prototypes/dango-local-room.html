<div id="dango-local-room" aria-label="Dango 本地普通房交互示意">
  <div class="viz-row dr-previewbar">
    <span class="text-small text-muted">交互示意 · 未接 WPF / 物理</span>
    <button class="btn btn-ghost" type="button" data-demo="start">从首页走一遍</button>
    <button class="btn btn-ghost" type="button" data-demo="fail">试一次打不开</button>
  </div>
  <div class="dr-desktop">
    <section class="dr-window" aria-label="普通房窗口">
      <header class="dr-chrome">
        <button class="dr-return cursor-interaction" type="button" data-action="back" aria-label="房门：返回门廊"><i data-lucide="door-open" aria-hidden="true"></i><span>房门</span></button>
        <span class="dr-title">小晴间</span>
        <span class="dr-local">本地 · 单人</span>
        <button class="dr-close cursor-interaction" type="button" data-action="hide" aria-label="隐藏画面"><i data-lucide="x" aria-hidden="true"></i></button>
      </header>
      <div class="dr-stage">
        <div class="dr-home">
          <button type="button" class="dr-editor dr-face cursor-interaction" data-action="face">捏脸 <small>D</small></button>
          <button type="button" class="dr-editor dr-outfit cursor-interaction" data-action="outfit">换装 <small>A</small></button>
          <button type="button" class="dr-home-door cursor-interaction" data-action="porch"><i data-lucide="door-open" aria-hidden="true"></i><span>房门</span><small>W</small></button>
          <div class="dr-panel" hidden><span class="dr-panel-title">捏脸</span><span class="dr-swatches"><b></b><b></b><b></b></span><button type="button" class="cursor-interaction" data-action="dismiss">收起</button></div>
        </div>
        <div class="dr-porch" hidden>
          <div class="dr-porch-wall"></div>
          <div class="dr-porch-ground"></div>
          <div class="dr-porch-world">
            <div class="dr-door-label">小晴间 <small>本地单人</small></div>
            <button type="button" class="dr-porch-door cursor-interaction" data-action="enter" aria-label="进入小晴间，本地单人"><span class="dr-door-knob"></span><span class="dr-door-w">W 进入</span></button>
          </div>
        </div>
        <div class="dr-room">
          <div class="dr-wall"></div>
          <div class="dr-sunwash"></div>
          <button class="dr-scene-door cursor-interaction" type="button" data-action="back" aria-label="场景房门，返回门廊"><span class="dr-door-knob"></span></button>
          <div class="dr-windowview" aria-hidden="true"><span class="dr-cloud dr-cloud-a"></span><span class="dr-cloud dr-cloud-b"></span><span class="dr-hill dr-hill-a"></span><span class="dr-hill dr-hill-b"></span><span class="dr-window-cross"></span></div>
          <div class="dr-floor"></div>
          <div class="dr-plant" aria-hidden="true"><span class="dr-stem"></span><span class="dr-leaf dr-leaf-a"></span><span class="dr-leaf dr-leaf-b"></span><span class="dr-leaf dr-leaf-c"></span><span class="dr-pot"></span></div>
          <div class="dr-daypatch" aria-hidden="true"></div>
          <div class="dr-frontedge" aria-hidden="true"></div>
        </div>
        <div class="dr-shadow" aria-hidden="true"></div>
        <div class="dr-pet" role="img" aria-label="团子，外形和动作均为示意"><span class="dr-eye dr-eye-left"></span><span class="dr-eye dr-eye-right"></span><span class="dr-cheek dr-cheek-left"></span><span class="dr-cheek dr-cheek-right"></span><span class="dr-mouth"></span></div>
        <div class="dr-entry" hidden><div class="dr-entrycard"><span class="dr-entry-message">正在开门…</span><div class="dr-entry-actions"><button type="button" class="cursor-interaction" data-action="retry" hidden>重试</button><button type="button" class="cursor-interaction" data-action="cancel">回门廊</button></div></div></div>
        <div class="dr-inputs">
          <button type="button" class="cursor-interaction" data-play="left" aria-label="A：向左">A <span>左</span></button>
          <button type="button" class="cursor-interaction" data-play="right" aria-label="D：向右">D <span>右</span></button>
          <button type="button" class="cursor-interaction" data-play="squash" aria-label="S：轻压">S <span>轻压</span></button>
          <button type="button" class="cursor-interaction" data-play="jump" aria-label="空格：跳跃">空格 <span>跳跃</span></button>
        </div>
      </div>
    </section>
    <div class="dr-hidden" hidden><i data-lucide="eye-off" aria-hidden="true"></i><span>画面已隐藏</span></div>
    <div class="dr-traymenu" hidden aria-label="托盘示意菜单"><button type="button" class="cursor-interaction" data-action="restore">恢复房间</button><button type="button" class="cursor-interaction" data-action="trayporch">房门</button></div>
    <button type="button" class="dr-tray cursor-interaction" data-action="tray" aria-label="打开托盘示意菜单"><i data-lucide="circle-dot" aria-hidden="true"></i><span>托盘</span></button>
  </div>
  <div class="dr-caption text-small text-muted" aria-live="polite">小晴间 · 平坦地面，固定镜头</div>
</div>
<style>

<script>
(() => {
  const root = document.getElementById('dango-local-room');
  const get = selector => root.querySelector(selector);
  const win = get('.dr-window'), stage = get('.dr-stage'), pet = get('.dr-pet');
  const home = get('.dr-home'), porch = get('.dr-porch'), room = get('.dr-room');
  const entry = get('.dr-entry'), panel = get('.dr-panel'), traymenu = get('.dr-traymenu');
  const caption = get('.dr-caption'), back = get('[data-action="back"]'), title = get('.dr-title');

  const state = { view:'room', hidden:false, failed:false, failNext:false, panel:null, x:42, porchX:56, generation:0 };
  let keys = new Set(), last = 0, frame = 0, hop = null, squash = null, pendingTimer = null;
  function save() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent:{ design:'小晴间', view:state.view, hidden:state.hidden }, privateContent:{ view:state.view, hidden:state.hidden } }).catch(() => {});
  }
  function render() {
    win.hidden = state.hidden; get('.dr-hidden').hidden = !state.hidden;
    home.hidden = state.view !== 'home'; porch.hidden = state.view !== 'porch' && state.view !== 'entering'; room.hidden = state.view !== 'room';
    entry.hidden = state.view !== 'entering'; panel.hidden = !state.panel || state.view !== 'home';
    title.textContent = state.view === 'home' ? '团子' : state.view === 'room' ? '小晴间' : '房门';
    back.querySelector('span').textContent = state.view === 'home' ? '房门' : state.view === 'porch' || state.view === 'entering' ? '首页' : '房门';
    get('.dr-panel-title').textContent = state.panel === 'outfit' ? '换装' : '捏脸';
    get('.dr-entry-message').textContent = state.failed ? '房间暂时打不开' : '正在开门…';
    get('[data-action="retry"]').hidden = !state.failed;
    get('[data-action="restore"]').textContent = state.view === 'room' ? '恢复房间' : '恢复画面';
    let screenX = state.x;
    if (state.view === 'home') screenX = state.panel ? 32 : 50;
    if (state.view === 'porch' || state.view === 'entering') {
      const camera = Math.max(-12,Math.min(35,state.porchX - 56));
      stage.style.setProperty('--dr-camera',`${-camera}%`); screenX = state.porchX - camera;
    }
    stage.style.setProperty('--dr-pet-x',`${screenX}%`);
    stage.style.setProperty('--dr-pet-width',state.view === 'home' ? '20%' : '16.5%');
    stage.style.setProperty('--dr-pet-height',state.view === 'home' ? '28%' : '22%');
    stage.style.setProperty('--dr-pet-bottom',state.view === 'home' ? '44%' : '10%');
    caption.textContent = state.hidden ? '× 仅隐藏 · 托盘可恢复画面或回门廊' : state.view === 'home' ? '首页示意 · W 房门 · D 捏脸 · A 换装' : state.view === 'porch' ? '门廊示意 · A / D 移动 · W 进入本地房间 · Esc 首页' : state.view === 'entering' ? state.failed ? '失败示意 · 门廊保持可操作，重试或返回' : '转场示意 · 目标画面就绪后才收起主界面' : '小晴间 · 平坦地面，固定镜头 · Esc 回门廊';
  }
  function clear() {
    keys.clear(); cancelAnimationFrame(frame); frame = 0; last = 0;
    cancelAnimationFrame(hop); clearTimeout(squash); hop = squash = null;
    stage.style.setProperty('--dr-hop','0px'); stage.style.setProperty('--dr-sx','1'); stage.style.setProperty('--dr-sy','1');
  }
  function navigate(view) {
    clear(); clearTimeout(pendingTimer); state.generation++; state.failed = false; state.panel = null; state.hidden = false; traymenu.hidden = true;
    state.view = view;
    if(view === 'room') state.x = 30;
    if(view === 'porch') state.porchX = 56;
    render(); save();
  }
  function enter() {
    if(state.view !== 'porch') return;
    if(Math.abs(state.porchX - 56) > 20) { caption.textContent = '靠近小晴间的门再进入'; return; }
    clear(); state.view = 'entering'; state.failed = false; const generation = ++state.generation;
    const fail = state.failNext; state.failNext = false; render(); save();
    pendingTimer = setTimeout(() => {
      if(generation !== state.generation || state.view !== 'entering') return;
      if(fail) { state.failed = true; render(); return; }
      requestAnimationFrame(() => { if(generation === state.generation && state.view === 'entering') navigate('room'); });
    },reduced ? 120 : 650);
  }
  function move(amount) {
    if(state.hidden || state.view === 'entering') return;
    if(state.view === 'room') state.x = Math.max(8,Math.min(92,state.x + amount));
    if(state.view === 'porch') state.porchX = Math.max(18,Math.min(120,state.porchX + amount));
    render();
  }
  function animate(action) {
    if(state.hidden || state.view === 'entering') return;
    if(action === 'squash') {
      stage.style.setProperty('--dr-sx','1.1'); stage.style.setProperty('--dr-sy','.78');
      clearTimeout(squash); squash = setTimeout(() => { stage.style.setProperty('--dr-sx','1'); stage.style.setProperty('--dr-sy','1'); },350);
    } else if(action === 'jump') {
      if(hop) return; const start = performance.now();
      const jump = now => {
        const p = Math.min(1,(now - start)/600);
        stage.style.setProperty('--dr-hop',`${reduced ? 0 : -4*p*(1-p)*65}px`);
        if(p < 1) hop = requestAnimationFrame(jump); else { hop = null; stage.style.setProperty('--dr-hop','0px'); }
      }; hop = requestAnimationFrame(jump);
    }
  }
  function tick(now) {
    const dt = Math.min(40,last ? now-last : 16); last = now;
    move((Number(keys.has('d')) - Number(keys.has('a'))) * dt *.025);
    frame = keys.size ? requestAnimationFrame(tick) : 0;
  }
  root.addEventListener('click',event => {
    const button = event.target.closest('button'); if(!button) return;
    const action = button.dataset.action, demo = button.dataset.demo, play = button.dataset.play;
    if(demo === 'start') { state.failNext = false; navigate('home'); }
    if(demo === 'fail') { navigate('porch'); state.failNext = true; enter(); }
    if(play === 'left' || play === 'right') { if(state.view === 'home') {state.panel = play === 'left' ? 'outfit' : 'face'; render();} else move(play === 'left' ? -7 : 7); }
    if(play === 'squash' || play === 'jump') animate(play);
    if(action === 'porch') navigate('porch');
    if(action === 'enter') enter();
    if(action === 'back') navigate(state.view === 'home' ? 'porch' : state.view === 'porch' || state.view === 'entering' ? 'home' : 'porch');
    if(action === 'face' || action === 'outfit') { state.panel = state.panel === action ? null : action; clear(); render(); save(); }
    if(action === 'dismiss') { state.panel = null; clear(); render(); }
    if(action === 'hide') { clear(); if(state.view === 'entering') navigate('porch'); state.hidden = true; traymenu.hidden = true; render(); save(); }
    if(action === 'tray') traymenu.hidden = !traymenu.hidden;
    if(action === 'restore') { clear(); state.hidden = false; traymenu.hidden = true; render(); save(); }
    if(action === 'trayporch' || action === 'cancel') navigate('porch');
    if(action === 'retry') { navigate('porch'); enter(); }
  });
  root.addEventListener('keydown',event => {
    if(state.hidden || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable || event.defaultPrevented) return;
    const key = event.key.toLowerCase(); if(!['a','d','s','w',' ','escape'].includes(key)) return;
    event.preventDefault();
    if(key === 'escape') { if(state.panel) { state.panel = null; clear(); render(); } else navigate(state.view === 'room' || state.view === 'entering' ? 'porch' : 'home'); return; }
    if(event.repeat && !['a','d'].includes(key)) return;
    if(key === 'w') { if(state.view === 'home') navigate('porch'); else if(state.view === 'porch') enter(); return; }
    if(key === 's') animate('squash'); if(key === ' ') animate('jump');
    if(key === 'a' || key === 'd') {
      if(state.view === 'home') {state.panel = key === 'a' ? 'outfit' : 'face'; render();}
      else if(state.view !== 'entering') { keys.add(key); if(!frame) frame = requestAnimationFrame(tick); }
    }
  });
  root.addEventListener('keyup',event => { keys.delete(event.key.toLowerCase()); if(!keys.size) {cancelAnimationFrame(frame); frame = 0; last = 0;} });
  root.addEventListener('focusout',event => { if(!root.contains(event.relatedTarget)) clear(); });
  window.addEventListener('blur',clear);
  document.addEventListener('visibilitychange',() => { if(document.hidden) clear(); });
  function restore(saved) {
    const value = saved?.privateContent; if(!value || !['home','porch','room'].includes(value.view)) return;
    clear(); state.view = value.view; state.hidden = !!value.hidden; render();
  }
  restore(window.openai?.widgetState); render();
  window.addEventListener('openai:set_globals',event => restore(event.detail?.globals?.widgetState));
})();
</script>
