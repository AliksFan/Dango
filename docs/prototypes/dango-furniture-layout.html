<div id="dango-furniture-layout-v1" aria-label="实时家具布置交互预览">
  <style>

    #dango-furniture-layout-v1 .world { width: 720px; height: 340px; position: absolute; left: 0; top: 0; transform-origin: top left; pointer-events: none; }
    #dango-furniture-layout-v1 .scene-floor { height: 40px; width: 720px; position: absolute; left: 0; top: 300px; background: var(--room-floor); border-top: 2px solid var(--room-floor-edge); }
    #dango-furniture-layout-v1 .scene-label { position: absolute; top: 10px; left: 12px; color: var(--room-muted); font-size: 12px; pointer-events: none; }
    #dango-furniture-layout-v1 .furniture-piece, #dango-furniture-layout-v1 .placement-ghost { position: absolute; padding: 0; min-height: 0; touch-action: none; pointer-events: auto; }

    #dango-furniture-layout-v1 .piece-platform { width: 140px; height: 22px; border: 0; border-top: 6px solid var(--room-wood-light); border-radius: 6px; background: var(--room-wood); box-shadow: 0 4px 0 var(--room-shadow); }
    #dango-furniture-layout-v1 .piece-ball { width: 132px; height: 132px; border-radius: 50%; border: 0; background: radial-gradient(circle at 32% 27%, var(--room-ball-light), var(--room-ball) 58%, var(--room-ball-dark)); overflow: hidden; }

    #dango-furniture-layout-v1 .dango-body { position: absolute; width: 88px; height: 88px; padding: 0; min-height: 0; border: 0; border-radius: 50%; background: var(--room-warm); box-shadow: inset 0 -5px 0 var(--room-warm-shadow); touch-action: none; pointer-events: auto; z-index: 3; }
    #dango-furniture-layout-v1 .dango-body:disabled { opacity: 1; }
    #dango-furniture-layout-v1 .dango-body[data-dango="friend"] { background: var(--room-friend); box-shadow: inset 0 -5px 0 var(--room-friend-shadow); }
    #dango-furniture-layout-v1 .dango-body[data-held="true"] { outline: 2px dashed var(--room-focus); outline-offset: 3px; }
    #dango-furniture-layout-v1 .dango-sprout { position: absolute; top: -9px; left: 47px; width: 5px; height: 15px; border-radius: 5px; background: var(--room-leaf); transform: rotate(12deg); }
    #dango-furniture-layout-v1 .dango-sprout::after { content: ""; position: absolute; width: 18px; height: 10px; left: 3px; top: 0; background: var(--room-leaf); border-radius: 16px 0 16px 0; transform: rotate(-18deg); }
    #dango-furniture-layout-v1 .dango-eye { position: absolute; top: 36px; width: 5px; height: 7px; border-radius: 50%; background: var(--room-face); }
    #dango-furniture-layout-v1 .dango-eye.left { left: 29px; }
    #dango-furniture-layout-v1 .dango-eye.right { left: 54px; }
    #dango-furniture-layout-v1 .dango-mouth { position: absolute; left: 39px; top: 46px; width: 11px; height: 6px; border: 2px solid var(--room-face); border-top: 0; border-radius: 0 0 8px 8px; }
    #dango-furniture-layout-v1 .dango-cheek { position: absolute; top: 46px; width: 11px; height: 5px; border-radius: 50%; background: var(--room-blush); }
    #dango-furniture-layout-v1 .dango-cheek.left { left: 16px; }
    #dango-furniture-layout-v1 .dango-cheek.right { right: 16px; }
    #dango-furniture-layout-v1 .dango-name { position: absolute; top: 94px; left: 0; width: 100%; font-size: 12px; color: var(--room-muted); white-space: nowrap; pointer-events: none; }
    #dango-furniture-layout-v1 .nudge-buttons { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); gap: 4px; justify-content: center; }
    #dango-furniture-layout-v1 .nudge-buttons button { width: 36px; min-height: 36px; padding: 4px; }
    #dango-furniture-layout-v1 .nudge-up { grid-column: 2; grid-row: 1; }
    #dango-furniture-layout-v1 .nudge-left { grid-column: 1; grid-row: 2; }
    #dango-furniture-layout-v1 .nudge-right { grid-column: 3; grid-row: 2; }
    #dango-furniture-layout-v1 .nudge-down { grid-column: 2; grid-row: 3; }
    #dango-furniture-layout-v1 .nudge-center { grid-column: 2; grid-row: 2; place-self: center; width: 5px; height: 5px; border-radius: 50%; background: var(--room-line); }
    #dango-furniture-layout-v1 .parameter-selection { margin-bottom: 8px; font-size: 12px; font-weight: 500; }
    #dango-furniture-layout-v1 .parameter-controls { min-height: 105px; }
    #dango-furniture-layout-v1 .parameter-controls[data-empty="true"] .parameter-field { visibility: hidden; }
    #dango-furniture-layout-v1 .parameter-field + .parameter-field { margin-top: 10px; }
    #dango-furniture-layout-v1 .parameter-field label { display: block; margin-bottom: 4px; font-size: 12px; }
    #dango-furniture-layout-v1 .parameter-field input[type="range"] { display: block; width: 100%; margin: 0; accent-color: var(--room-action); opacity: .55; }
    #dango-furniture-layout-v1 .parameter-directions { display: flex; justify-content: space-between; color: var(--room-muted); font-size: 12px; }
    #dango-furniture-layout-v1 .parameter-note { margin: 8px 0 0; color: var(--room-muted); font-size: 12px; }
    #dango-furniture-layout-v1 .room-feedback { margin-top: 8px; padding: 8px 10px; background: var(--room-panel); border-radius: 8px; color: var(--room-muted); font-size: 12px; }
    #dango-furniture-layout-v1 .room-feedback[data-error="true"] { color: var(--room-error); background: var(--room-error-fill); }
    #dango-furniture-layout-v1 .room-footer { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 10px 14px; border-top: 1px solid var(--room-line); color: var(--room-muted); font-size: 12px; }
    #dango-furniture-layout-v1 .sr-label { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 660px) {
      #dango-furniture-layout-v1 .room-titlebar { padding-left: 12px; }
      #dango-furniture-layout-v1 .room-controls { padding: 10px; }
      #dango-furniture-layout-v1 .room-body { grid-template-columns: 1fr; padding: 0 8px 10px; }
      #dango-furniture-layout-v1 .room-main { grid-row: 1; }
      #dango-furniture-layout-v1 .room-footer { padding: 10px; }
    }
    @media (pointer: coarse) {
      #dango-furniture-layout-v1 button { min-height: 44px; }
      #dango-furniture-layout-v1 .icon-button { width: 44px; }
      #dango-furniture-layout-v1 .nudge-buttons { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
      #dango-furniture-layout-v1 .nudge-buttons button { width: 44px; min-height: 44px; }
      #dango-furniture-layout-v1 .furniture-piece, #dango-furniture-layout-v1 .placement-ghost, #dango-furniture-layout-v1 .dango-body { min-height: 0; }
      #dango-furniture-layout-v1 .piece-platform::after { content: ""; position: absolute; left: 0; right: 0; top: -12px; bottom: -12px; }
    }
  </style>
  <div class="room-window" data-room-ui="side" data-editing="true" aria-label="侧栏家具布置">
    <header class="room-titlebar"><span class="room-brand" aria-hidden="true"></span><div><div class="room-heading">团子的房间</div><div class="room-caption">实时布置 · 交互预览</div></div></header>
    <div class="room-controls">
      <div class="room-mode"><span class="room-mode-dot" aria-hidden="true"></span><span data-mode-label>布置中 · 团子留场</span></div>
      <div class="room-actions">
        <div class="room-tools" role="group" aria-label="布置工具">
          <button class="icon-button tool-button cursor-interaction" type="button" data-tool="furniture" aria-label="家具选择与拖动工具" aria-pressed="true" data-tooltip="选择／拖动家具"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i></button>
          <button class="icon-button tool-button cursor-interaction" type="button" data-tool="glove" aria-label="手套工具，拖动团子" aria-pressed="false" data-tooltip="手套 · 拖动团子"><i data-lucide="hand" aria-hidden="true"></i></button>
          <button class="icon-button room-quiet cursor-interaction" type="button" data-action="remove" aria-label="删除选中的家具" data-tooltip="删除已选家具"><i data-lucide="trash-2" aria-hidden="true"></i></button>
        </div>
        <div class="preview-actions" data-preview-actions hidden>
          <button class="icon-button room-primary cursor-interaction" type="button" data-action="confirm" aria-label="确认当前家具预览" data-tooltip="确认家具位置"><i data-lucide="check" aria-hidden="true"></i></button>
          <button class="icon-button room-quiet cursor-interaction" type="button" data-action="cancel-preview" aria-label="取消当前未确认预览" data-tooltip="取消本次预览"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
        <button class="icon-button room-quiet cursor-interaction" type="button" data-action="exit" aria-label="结束布置，保留已确认操作" data-tooltip="结束布置"><i data-lucide="log-out" aria-hidden="true"></i></button>
        <button class="icon-button room-primary cursor-interaction" type="button" data-action="edit" aria-label="进入家具布置" data-tooltip="布置家具" hidden><i data-lucide="pencil" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="room-body">
      <aside class="room-catalog" aria-label="家具布置侧栏">
        <section class="sidebar-section" data-sidebar-section="move" aria-label="家具微调">

          <div class="nudge-buttons" data-nudge>
            <button class="icon-button nudge-up cursor-interaction" type="button" data-dx="0" data-dy="-1" aria-label="向上微调家具预览"><i data-lucide="arrow-up" aria-hidden="true"></i></button>
            <button class="icon-button nudge-left cursor-interaction" type="button" data-dx="-1" data-dy="0" aria-label="向左微调家具预览"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
            <span class="nudge-center" aria-hidden="true"></span>
            <button class="icon-button nudge-right cursor-interaction" type="button" data-dx="1" data-dy="0" aria-label="向右微调家具预览"><i data-lucide="arrow-right" aria-hidden="true"></i></button>
            <button class="icon-button nudge-down cursor-interaction" type="button" data-dx="0" data-dy="1" aria-label="向下微调家具预览"><i data-lucide="arrow-down" aria-hidden="true"></i></button>
          </div>
        </section>
        <section class="sidebar-section" data-sidebar-section="parameters" aria-label="家具参数">

            <div class="parameter-field"><label for="dango-furniture-size-preview">大小</label><input id="dango-furniture-size-preview" type="range" value="50" disabled aria-describedby="dango-parameter-placeholder-note" aria-valuetext="示意，参数调节后续接入"><div class="parameter-directions" aria-hidden="true"><span>小</span><span>大</span></div></div>
            <div class="parameter-field" data-param-elasticity-row hidden><label for="dango-furniture-elasticity-preview">弹性</label><input id="dango-furniture-elasticity-preview" type="range" value="50" disabled aria-describedby="dango-parameter-placeholder-note" aria-valuetext="示意，参数调节后续接入"><div class="parameter-directions" aria-hidden="true"><span>低</span><span>高</span></div></div>

          </div>
          <span class="scene-label" data-scene-label>A/D/空格操作自己 · 右键拖动视角</span>
        </div>
        <div class="room-feedback" data-feedback role="status" aria-live="polite">拖动或微调只产生预览，点击勾后应用。</div>
      </main>
    </div>
    <footer class="room-footer"><span>交互示意 · 简化几何，无真实多人、物理或存档；他人主动保护／挣脱未演示。</span><span data-storage>仅本次预览</span></footer>
  </div>
  <script>
    (() => {

      }
      if (!restore(window.openai && window.openai.widgetState)) render();
      scheduleFrame();
    })();
  </script>
</div>
