<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dango · 本地房间目录设计小样</title>
<style>
:root{color-scheme:light;--bg:#fdfcf9;--ink:#443d34;--muted:#807568;--line:#e9e4da;--soft:#f3efe8;--accent:#885e3e;--selected:#efe3d4}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px "Segoe UI","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}button,input,select{border:1px solid var(--line);border-radius:7px;padding:8px 14px;min-height:40px;background:var(--bg)}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}.primary{background:var(--selected);border-color:var(--accent)}.icon{width:32px;min-height:32px;padding:5px}.symbol{font-size:18px;line-height:1}.note{font-size:12px;color:var(--muted);line-height:1.7}.muted{color:var(--muted)}
.sample{max-width:1080px;margin:20px auto;padding:0 20px}.sample-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.sample-bar select{max-width:225px}
.window{min-height:600px;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--line)}
.content{display:grid;grid-template-columns:minmax(180px,1fr) minmax(340px,400px);min-height:535px}.porch{padding:36px 24px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:38px;background:linear-gradient(var(--bg) 79%,var(--soft) 79%)}
.scene-label{position:absolute;top:24px;left:24px}.doors{display:flex;align-items:flex-end;gap:18px;overflow:auto;padding:6px 4px 20px}.door{min-width:94px;height:170px;border:1px solid #b7a28e;border-radius:42px 42px 5px 5px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 8px;gap:5px;background:var(--bg)}.door[aria-pressed=true]{background:var(--selected);border-color:var(--accent)}.door small{font-size:11px;color:var(--muted)}
.scene-help{max-width:340px;line-height:1.9}.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;max-height:535px}.panel-top{padding:20px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1,h2,h3,p{margin:0}h1{font-size:16px;font-weight:600}h2{font-size:15px;font-weight:600}h3{font-size:13px;font-weight:500;color:var(--muted)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#b7a28e var(--soft);padding:0 20px;flex:1;min-height:180px}.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-track{background:var(--soft)}.scroll::-webkit-scrollbar-thumb{background:#b7a28e;border-radius:5px}.scroll::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.row{padding:14px 0;border-bottom:1px solid var(--line)}.row-head,.row-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.row-actions{justify-content:flex-end;margin-top:10px}.row .note{margin-top:5px}.row.selected .room-name{color:var(--accent)}.badge{font-size:11px;color:var(--muted)}.group{margin:24px 0 4px}.feedback{padding:14px 20px;min-height:64px;line-height:1.7;border-top:1px solid var(--line)}.feedback[data-error=true]{color:#86452c}.empty{padding:28px 0;line-height:1.8}
.footer{padding:14px 22px;border-top:1px solid var(--line)}dialog{width:min(430px,calc(100vw - 32px));padding:26px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#443d3430}dialog p{line-height:1.9;margin:14px 0}dialog label{display:flex;flex-direction:column;gap:7px;margin:16px 0}.form-inline{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialog-error{color:#86452c;line-height:1.7;min-height:24px}
@media(max-width:750px){.sample{padding:0 12px;margin:12px auto}.sample-bar{align-items:flex-start;flex-direction:column;gap:6px}.content{grid-template-columns:1fr}.porch{min-height:290px;padding:58px 20px 24px;gap:14px}.door{height:130px}.scene-help{display:none}.panel{border-left:0;border-top:1px solid var(--line);max-height:490px}.window{min-height:0}.top{padding:12px 16px}.scroll{min-height:140px}.panel-top{padding:16px 20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(forced-colors:active){button,.window,.panel,.row,dialog,.door{border-color:ButtonText}.primary,.door[aria-pressed=true]{outline:2px solid Highlight}.feedback[data-error=true]{color:CanvasText}}
</style>
<div class="sample">
 <div class="sample-bar"><p class="note">设计小样 · 全部为虚构数据，仅当前页面内演示。未接文件、物理或服务。</p>
 <label class="note">查看状态 <select id="scenario" aria-label="查看设计状态"><option value="normal">常用 · 2/3</option><option value="full">已满 · 3/3</option><option value="empty">已解散全部 · 0/3</option><option value="readonly">缓存布局只读</option><option value="failure">模拟写入失败</option><option value="protected">目录受保护</option><option value="clock">本机时间异常</option><option value="archive">多条已解散内容</option></select></label></div>
 <main class="window"><header class="top"><span>Dango · 门廊</span><button id="home"><span aria-hidden="true">↗</span>首页</button></header>
 <div class="content"><section class="porch" aria-label="房门排列示意"><span class="scene-label note">此区域保留现有真实门廊与团子</span><div id="doors" class="doors"></div><p class="scene-help note">本小样只核对房间管理。正式产品继续走近房门后按 W 进入，按 E 布置；窗口与桌宠保持原有玩法。</p></section>
 <aside class="panel" aria-label="房间管理"><div class="panel-top"><h1>普通房 <span id="quota" class="muted"></span></h1><button id="create" class="primary"><span class="symbol" aria-hidden="true">＋</span>新建</button></div><div id="rooms" class="scroll"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div></aside></div>
 <footer class="footer note">首页启动，记住选择。恢复房间不会自动入房；安全位置与镜头在你主动进入后恢复。</footer></main>
</div>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form"><h2 id="create-title">新建普通房</h2><label>名称<input id="room-name" maxlength="24" required autocomplete="off"></label><div class="form-inline"><label>类型<select id="room-kind"><option>私密</option><option>公共</option></select></label><label>容量<input id="room-capacity" type="number" min="1" max="12" value="6" required></label></div><p class="note">仅创建到本地，尚未开放他人进入。桌宠房不占普通房额度。</p><div id="create-error" class="dialog-error" role="alert"></div><div class="actions"><button type="button" data-close="create-dialog">取消</button><button type="submit" class="primary"><span aria-hidden="true">＋</span>创建</button></div></form></dialog>
<dialog id="dissolve-dialog" aria-labelledby="dissolve-title"><h2 id="dissolve-title"></h2><p id="dissolve-copy"></p><p class="note">7天内可恢复，恢复需有空余名额且不会自动入房。到期关闭常规恢复入口，本机存档保留。</p><div id="dissolve-error" class="dialog-error" role="alert"></div><div class="actions"><button data-close="dissolve-dialog">取消</button><button id="dissolve-confirm" class="primary"></button></div></dialog>
<script>
const el=id=>document.getElementById(id);let rooms=[],selected=null,mode='normal',target=null,confirmStep=0,serial=3;
const fictional=(id,name,extra={})=>({id,name,kind:'私密',capacity:6,active:true,...extra});
function reset(){mode=el('scenario').value;rooms=[fictional('a','小晴间'),fictional('b','茶歇室')];if(mode==='full')rooms.push(fictional('c','云朵间'));
 if(mode==='empty')rooms=[];if(mode==='readonly')rooms[1].readonly=true;
 rooms.push(fictional('past','晚风间',{active:false,days:5}),fictional('expired','旧画室',{active:false,days:0}));
 if(mode==='archive')for(let i=0;i<8;i++)rooms.push(fictional('archive-'+i,'旧房间 '+(i+1),{active:false,days:i%3}));
 selected=rooms.find(r=>r.active)?.id??null;render();say(mode==='protected'?'目录无法识别，原件已保护。普通房操作暂停，桌宠仍可使用。':mode==='failure'?'已启用设计用写入失败状态。尝试创建、解散或恢复可查看反馈。':'本小样未执行任何文件保存。',mode==='protected');}
function say(message,error=false){el('feedback').textContent=message;el('feedback').dataset.error=String(error)}
function btn(text,action,{disabled=false,icon=null,name=null}={}){let b=document.createElement('button');b.type='button';b.disabled=disabled;if(icon){let s=document.createElement('span');s.textContent=icon;s.setAttribute('aria-hidden','true');b.append(s)}b.append(document.createTextNode(text));if(name)b.setAttribute('aria-label',name);b.addEventListener('click',action);return b}
function render(){let active=rooms.filter(r=>r.active),protectedMode=mode==='protected';el('quota').textContent=protectedMode?'—':`${active.length}/3`;el('create').disabled=protectedMode||active.length>=3;el('create').title=active.length>=3?'已满3间，请先解散一间':'';
 el('doors').replaceChildren();for(let r of active){let b=btn('',()=>{selected=r.id;render();say(`已选择「${r.name}」。正式产品仍需主动入房。`)});b.className='door';b.disabled=protectedMode;b.setAttribute('aria-pressed',String(selected===r.id));let n=document.createElement('span');n.textContent=r.name;let s=document.createElement('small');s.textContent=r.readonly?'缓存 · 只读':'本地单人';b.append(n,s);el('doors').append(b)}
 let pet=btn('',()=>say('桌宠入口保持原合同，不计普通房额度。'));pet.className='door';let petName=document.createElement('span');petName.textContent='桌宠房';let petHint=document.createElement('small');petHint.textContent='不占额度';pet.append(petName,petHint);el('doors').append(pet);
 el('rooms').replaceChildren();if(!active.length){let p=document.createElement('p');p.className='empty muted';p.textContent='还没有有效普通房，可新建或恢复一间。';el('rooms').append(p)}
 for(let r of active)row(r,false,protectedMode);let title=document.createElement('h3');title.textContent='已解散';title.className='group';el('rooms').append(title);for(let r of rooms.filter(r=>!r.active))row(r,true,protectedMode);
}
function row(r,archived,protectedMode){let box=document.createElement('div');box.className='row'+(r.id===selected?' selected':'');let head=document.createElement('div');head.className='row-head';let name=document.createElement('span');name.className='room-name';name.textContent=r.name;let badge=document.createElement('span');badge.className='badge';badge.textContent=archived?(mode==='clock'?'时间待核对':r.days>0?`剩余 ${r.days} 天`:'已到期 · 存档保留'):r.readonly?'缓存 · 家具只读':'仅本地';head.append(name,badge);let note=document.createElement('p');note.className='note';note.textContent=archived?'恢复后保持原房间身份与内容':`${r.kind} · ${r.capacity}席 · ${r.readonly?'断网可单人游玩，家具暂不可编辑':'尚未开放他人入场'}`;let actions=document.createElement('div');actions.className='row-actions';
 if(archived){actions.append(btn('恢复',()=>recover(r),{disabled:protectedMode||r.days<=0||mode==='clock',icon:'↶',name:`恢复${r.name}`}))}
 else{actions.append(btn('进入',()=>{selected=r.id;render();say(`小样：主动进入「${r.name}」。真实场景尚未在本小样实现。`)},{disabled:protectedMode,icon:'↗',name:`进入${r.name}`}));actions.append(btn('解散',()=>beginDissolve(r),{disabled:protectedMode,icon:'×',name:`解散${r.name}`}))}box.append(head,note,actions);el('rooms').append(box)}
function recover(r){if(rooms.filter(x=>x.active).length>=3)return say('普通房已满3间，请先解散一间再恢复。存档已保留。',true);if(mode==='failure')return say('恢复未保存，原解散状态及内容已保留。请重试。',true);r.active=true;render();say(`「${r.name}」已恢复（小样状态）。未自动入房。`)}
function beginDissolve(r){target=r;confirmStep=0;el('dissolve-error').textContent='';paintDissolve();el('dissolve-dialog').showModal()}
function paintDissolve(){el('dissolve-title').textContent=confirmStep?'再次确认解散':'解散普通房';el('dissolve-copy').textContent=confirmStep?`确定解散「${target.name}」？确认后该房立即停止使用并释放1个名额。`:`「${target.name}」解散后将停止进入和互动，并立即释放1个普通房名额。`;el('dissolve-confirm').textContent=confirmStep?'确认解散':'继续确认'}
el('dissolve-confirm').onclick=()=>{if(!confirmStep){confirmStep=1;paintDissolve();return}if(mode==='failure'){el('dissolve-error').textContent='解散未保存，房间仍然有效，额度未变化。';return}target.active=false;target.days=7;if(selected===target.id)selected=null;el('dissolve-dialog').close();render();say(`「${target.name}」已解散（小样状态），7天内可恢复。`)};
el('create').onclick=()=>{el('room-name').value='普通房 '+serial;el('room-kind').value='私密';el('room-capacity').value=6;el('create-error').textContent='';el('create-dialog').showModal()};
el('create-form').onsubmit=e=>{e.preventDefault();if(mode==='failure'){el('create-error').textContent='创建未保存，未增加房间或占用名额。请重试。';return}if(rooms.filter(r=>r.active).length>=3){el('create-error').textContent='已满3间，请先解散一间。';return}let name=el('room-name').value.trim();if(!name){el('create-error').textContent='请输入名称。';return}let r=fictional('new-'+serial++,name,{kind:el('room-kind').value,capacity:Number(el('room-capacity').value)});rooms.push(r);selected=r.id;el('create-dialog').close();render();say(`「${r.name}」已创建（小样状态），已选中但未入房。`)};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el(b.dataset.close).close());el('scenario').onchange=reset;el('home').onclick=()=>say('启动保持首页；上次选择仅用于门廊提示，不自动入房。');reset();
</script>
</html>
