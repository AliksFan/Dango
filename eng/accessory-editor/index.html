<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑配饰</title>
<link rel="stylesheet" href="theme.css"><script src="bundle.js" defer></script></head>
<body><div class="wrapper unified-editor" data-skeleton-scope>
<nav id="main_menu" class="main_menu" aria-label="编辑操作"><input id="accessory_name" maxlength="128" aria-label="配饰名称" value="配饰"><span class="menu-spacer"></span><div id="toggle_preview"></div><button id="undo_button" title="撤销 Ctrl+Z">↶ 撤销</button><button id="redo_button" title="重做 Ctrl+Shift+Z">↷ 重做</button></nav>
<div class="submenu"><div id="action_attributes" class="block attributes"></div></div>
<aside class="sidebar_left" aria-label="编辑工具栏"><div id="tools_container" aria-label="图像工具"></div><div id="skeleton_tools"><button id="geometry_modify" aria-pressed="false" title="修改骨架 K"><svg viewBox="0 0 20 20"><path d="m4 15 8-10M2 13l4 4M10 3l4 4m1 8h4m-2-2v4"/></svg><span>修改骨架</span><kbd>K</kbd></button><button id="geometry_draw" aria-pressed="false" title="绘制骨架 Shift+K"><svg viewBox="0 0 20 20"><path d="m4 15 8-10M2 13l4 4M10 3l4 4m1 8h4m-2-2v4"/></svg><span>绘制骨架</span><kbd>⇧K</kbd></button></div>
<details class="image-options"><summary>图像调整</summary><div><button id="flip_x">↔ 整图水平</button><button id="flip_y">↕ 整图垂直</button><button id="rotate">↶ 整图左转</button><button id="restore_pixels" aria-pressed="false">↺ 恢复像素</button><label>恢复笔径<input id="restore_size" type="number" min="1" max="300" value="30" aria-label="恢复笔径"></label><div class="colors block"><h2>颜色</h2><div class="content" id="toggle_colors"></div></div><div class="details block" id="details_base"><h2>图层参数</h2><div class="content details-content" id="toggle_details"></div></div></div></details></aside>
<div class="middle_area" id="middle_area"><canvas id="ruler_left" class="ruler_left"></canvas><canvas id="ruler_top" class="ruler_top"></canvas><div class="main_wrapper" id="main_wrapper"><div class="canvas_wrapper" id="canvas_wrapper"><div id="mouse"></div><div class="transparent-grid" id="canvas_minipaint_background"></div><canvas id="canvas_minipaint" aria-label="图像画布"></canvas></div></div></div>
<aside class="sidebar_right" aria-label="图层组和骨架属性"><section id="layers_panel" class="editor-panel" data-expanded="true"><header><button class="panel-toggle" data-panel="layers_panel" aria-expanded="true">图层</button><button id="new_group" type="button" title="创建图层组">＋ 组</button></header><div class="panel-body"><div class="content" id="layers_base"></div><details class="group-actions"><summary>组操作</summary><div><button id="assign_group">归入当前组</button><button id="ungroup_layer">脱组</button></div></details></div></section>
<section id="skeleton_panel" class="editor-panel" data-expanded="true"><header><button class="panel-toggle" data-panel="skeleton_panel" aria-expanded="true">骨架属性 <span id="group_heading"></span></button></header><div class="panel-body"><p id="group_empty">选择图层组</p><div id="group_fields" hidden><p id="root_source"></p>
<label class="compact-parameter"><svg viewBox="0 0 20 20"><path d="m3 15 5-10 5 10 4-7"/></svg><span>弯曲幅度</span><input type="number" data-skeleton-param="bend" min="0" max="1" step=".01" aria-label="弯曲幅度"><input type="range" data-skeleton-param="bend" min="0" max="1" step=".01" aria-label="弯曲幅度滑条"></label>
<label class="compact-parameter"><svg viewBox="0 0 20 20"><path d="M3 10h14m-11-3-3 3 3 3m8-6 3 3-3 3"/></svg><span>伸缩弹性</span><span class="parameter-value"><input type="number" data-skeleton-param="elasticity" min="0" max="50" step=".1" aria-label="伸缩弹性">%</span><input type="range" data-skeleton-param="elasticity" min="0" max="50" step=".1" aria-label="伸缩弹性滑条"></label>
<label class="compact-parameter"><svg viewBox="0 0 20 20"><path d="M10 3v14m-4-4 4 4 4-4"/></svg><span>重力响应</span><input type="number" data-skeleton-param="gravity" min="0" max="100" step=".1" aria-label="组重力响应"><input type="range" data-skeleton-param="gravity" min="0" max="100" step=".1" aria-label="组重力响应滑条"></label>
<section class="fine-parameters" aria-label="形变细调"><div class="fine-heading">形变细调 <span id="fine_summary" hidden></span></div><div>
<label class="compact-parameter"><svg viewBox="0 0 20 20"><path d="m2 10 3-6 3 12 3-9 3 5 4-2"/></svg><span>形变阻尼</span><span class="parameter-value"><input type="number" data-skeleton-param="damping" min="0" max="30" step=".1" aria-label="形变阻尼">s⁻¹</span><input type="range" data-skeleton-param="damping" min="0" max="30" step=".1" aria-label="形变阻尼滑条"></label>
<label class="compact-parameter"><svg viewBox="0 0 20 20"><path d="M4 12a6 6 0 1 0 1-7M2 3v5h5"/></svg><span>形变恢复</span><span class="parameter-value"><input type="number" data-skeleton-param="restoration" min="0" max="30" step=".1" aria-label="形变恢复">rad/s</span><input type="range" data-skeleton-param="restoration" min="0" max="30" step=".1" aria-label="形变恢复滑条"></label>
</div></section></div></div></section></aside></div>
<div id="geometry_status" role="status"></div><div id="skeleton_menu" role="menu" aria-label="骨架上下文命令" hidden></div>
<div hidden><div id="info_base"><div id="toggle_info"></div></div><button id="left_mobile_menu_button"></button><button id="mobile_menu_button"></button><div id="tmp"></div></div><div id="popups"></div></body></html>
